# Behaviours that upstream GitHub CI gates on a literal matrix group name.
#
# Everything else in this runner is driven by the task flags, so adding or
# removing a task or a group upstream needs no change here. A group-gated step
# cannot be expressed that way, so each task it applies to is recorded below and
# implemented in tools/ci/task_exec.sh.
#
# tools/ci/ci_matrix.py fails the run if upstream gates a step on a group whose
# tasks are not listed here, rather than letting the Gitee build differ silently.
#
# Format:  <task name> | <quirk id> | <why>
#
# quirk ids implemented in task_exec.sh:
#   riscv_xpack_toolchain  replace the manifest's prebuilt riscv-none-elf GCC
#                          with the xPack toolchain shipped in the CI image

rv-virt:citest64 | riscv_xpack_toolchain | manifest GCC 13.4.0 fails to link rv64: "relocation truncated to fit: R_RISCV_HI20" in its rv64imafdc/lp64d libgcc (open-vela/public-actions#69)

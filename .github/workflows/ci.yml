# .github/workflows/ci.yml
#
# Gitee PR CI. Triggered by the Jenkins gitee-ci-proxy job via
# repository_dispatch; Jenkins owns every Gitee interaction, so there are no
# Gitee credentials on the GitHub side.
#
# The task list is not maintained here. The parse job reads the matrix out of
# the GitHub CI workflow in open-vela/public-actions and derives each group's
# capabilities from the task flags, so tasks and groups added or removed
# upstream are picked up on the next run. No group name is hard-coded below.
name: Gitee CI/CT

on:
  repository_dispatch:
    types: [gitee-pr-ci]
  workflow_dispatch:
    inputs:
      pr_branch:
        description: 'Target branch (selects the upstream CI workflow to mirror)'
        type: string
        default: trunk
      upstream_ref:
        description: 'public-actions ref to read the matrix from (default: same as pr_branch routing)'
        type: string
        default: ''

permissions: {}

env:
  UPSTREAM_REPO: open-vela/public-actions

jobs:
  # ============================================================
  # Job 1: read the upstream matrix and the pinned tool versions
  # ============================================================
  parse:
    runs-on: ubuntu-latest
    outputs:
      org: ${{ steps.payload.outputs.org }}
      repo: ${{ steps.payload.outputs.repo }}
      pr_id: ${{ steps.payload.outputs.pr_id }}
      pr_branch: ${{ steps.payload.outputs.pr_branch }}
      manifest_url: ${{ steps.payload.outputs.manifest_url }}
      all_pr: ${{ steps.payload.outputs.all_pr }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      pins: ${{ steps.matrix.outputs.pins }}
      fingerprint: ${{ steps.matrix.outputs.fingerprint }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v5

      - name: Parse and validate payload
        id: payload
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_PR_BRANCH: ${{ inputs.pr_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: no Gitee PR, just exercise the build matrix.
            echo "org=open-vela"                >> $GITHUB_OUTPUT
            echo "repo=nuttx"                   >> $GITHUB_OUTPUT
            echo "pr_id=0"                      >> $GITHUB_OUTPUT
            echo "pr_branch=${INPUT_PR_BRANCH}" >> $GITHUB_OUTPUT
            echo "manifest_url=https://gitee.com/open-vela/manifests" >> $GITHUB_OUTPUT
            echo "all_pr="                      >> $GITHUB_OUTPUT
            exit 0
          fi

          for field in org repo pr_id pr_branch; do
            val=$(echo "$CLIENT_PAYLOAD" | jq -r ".$field // empty")
            if [ -z "$val" ]; then
              echo "::error::Missing required field: $field"
              exit 1
            fi
            echo "$field=$val" >> $GITHUB_OUTPUT
          done
          echo "manifest_url=$(echo "$CLIENT_PAYLOAD" | jq -r '.manifest_url // empty')" >> $GITHUB_OUTPUT

          ORG=$(echo "$CLIENT_PAYLOAD" | jq -r '.org')
          REPO=$(echo "$CLIENT_PAYLOAD" | jq -r '.repo')
          PR_ID=$(echo "$CLIENT_PAYLOAD" | jq -r '.pr_id')

          # depends-on, validated one URL at a time; the manifest PR goes first
          # because applying it changes what the other projects sync to.
          echo "$CLIENT_PAYLOAD" | jq -r '.pr_description // empty' > /tmp/pr_desc.txt
          DEPENDS=$(grep -oP 'depends-on:\s*\[[^]]+\]' /tmp/pr_desc.txt 2>/dev/null \
                    | grep -oP '(?<=\[)[^]]+(?=\])' || true)
          PR_LIST="https://gitee.com/$ORG/$REPO/pulls/$PR_ID $DEPENDS"
          PR_LIST=$(echo $PR_LIST | awk '{for(i=1;i<=NF;i++) if(!a[$i]++) printf "%s%s",$i,(i==NF?ORS:OFS)}')
          ALL_PR=""
          for url in $PR_LIST; do
            if echo "$url" | grep -qP '^https://gitee\.com/[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+/pulls/[0-9]+$'; then
              pair=$(echo "$url" | sed -n 's#https://gitee.com/\([^/]\+/[^/]\+\)/pulls/\([0-9]\+\)#\1:\2#p')
              [ -n "$pair" ] && ALL_PR="$ALL_PR $pair"
            else
              echo "::warning::ignoring invalid depends-on entry: $url"
            fi
          done
          manifest_part=$(echo "$ALL_PR" | grep -o 'open-vela/manifests[^ ]*' || true)
          if [ -n "$manifest_part" ]; then
            rest=$(echo "$ALL_PR" | sed "s|$manifest_part||" | xargs)
            ALL_PR="$manifest_part $rest"
          fi
          echo "all_pr=$(echo $ALL_PR | xargs)" >> $GITHUB_OUTPUT

      - name: Derive matrix from upstream GitHub CI
        id: matrix
        env:
          PR_BRANCH: ${{ steps.payload.outputs.pr_branch }}
          UPSTREAM_REF_OVERRIDE: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml

          # Which upstream workflow serves this target branch is decided by the
          # dispatcher every openvela PR goes through, so it is read rather
          # than restated here: a new branch family upstream needs no change.
          disp="https://raw.githubusercontent.com/${UPSTREAM_REPO}/dev/.github/workflows/ci.yml"
          curl -fsSL "$disp" -o /tmp/dispatcher.yml
          python3 tools/ci/ci_matrix.py --dispatcher /tmp/dispatcher.yml \
            --resolve-branch "${PR_BRANCH}" --format route > /tmp/route.env
          cat /tmp/route.env
          # shellcheck disable=SC1091
          . /tmp/route.env
          ref="${UPSTREAM_REF_OVERRIDE:-$CI_UPSTREAM_REF}"
          path="${CI_UPSTREAM_PATH}"

          url="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${ref}/${path}"
          echo "Upstream CI: $url (route via ${CI_UPSTREAM_VIA})"
          if ! curl -fsSL "$url" -o /tmp/upstream-ci.yml; then
            echo "::error::cannot fetch the upstream CI workflow: $url"
            exit 1
          fi

          python3 tools/ci/ci_matrix.py --workflow /tmp/upstream-ci.yml --format report
          matrix=$(python3 tools/ci/ci_matrix.py --workflow /tmp/upstream-ci.yml --format matrix)
          python3 tools/ci/ci_matrix.py --workflow /tmp/upstream-ci.yml --format env > /tmp/pins.env

          # The matrix and the pins have to come from the same upstream content,
          # otherwise a new task could run against stale versions.
          fp=$(sed -n 's/^CI_UPSTREAM_FINGERPRINT=//p' /tmp/pins.env)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "fingerprint=$fp" >> $GITHUB_OUTPUT
          {
            echo 'pins<<PINS_EOF'
            grep -v '^CI_UPSTREAM_FINGERPRINT=' /tmp/pins.env
            echo 'PINS_EOF'
          } >> $GITHUB_OUTPUT

          {
            echo "### Gitee CI matrix"
            echo
            echo "- target branch: \`${PR_BRANCH}\`"
            echo "- upstream: \`${UPSTREAM_REPO}@${ref}\` \`${path}\` (via \`${CI_UPSTREAM_VIA}\`)"
            echo "- fingerprint: \`sha256:${fp}\`"
            echo
            echo '```'
            python3 tools/ci/ci_matrix.py --workflow /tmp/upstream-ci.yml --format report
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Job 2: one sync, one snapshot, shared by every group
  # ============================================================
  setup:
    needs: parse
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.snapshot.outputs.name }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          sudo curl -fsSL -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Clean up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Repo Init and Sync
        env:
          PR_BRANCH: ${{ needs.parse.outputs.pr_branch }}
          MANIFEST_URL: ${{ needs.parse.outputs.manifest_url }}
        run: |
          set -euo pipefail
          repo init -u "$MANIFEST_URL" -b "${PR_BRANCH:-trunk}" -m openvela.xml \
            --group=default,platform-linux --depth=1 --git-lfs
          repo sync -c -d --no-tags --force-sync -j$(nproc)

      - name: Generate snapshot and PR info
        id: snapshot
        env:
          ALL_PR: ${{ needs.parse.outputs.all_pr }}
          ORG: ${{ needs.parse.outputs.org }}
          REPO: ${{ needs.parse.outputs.repo }}
          PR_ID: ${{ needs.parse.outputs.pr_id }}
        run: |
          set -euo pipefail
          SNAPSHOT_NAME="snapshot_${ORG}_${REPO}_${PR_ID}"
          PR_INFO_FILE="pr_info_${ORG}_${REPO}_${PR_ID}"
          repo manifest -r -o "$SNAPSHOT_NAME"
          touch "$PR_INFO_FILE"

          for PR_INFO in $ALL_PR; do
            REPO_FULL_PATH=$(echo "$PR_INFO" | cut -d ':' -f 1 | xargs)
            PR_NUMBER=$(echo "$PR_INFO" | cut -d ':' -f 2)
            PROJECT_NAME=$(echo "$REPO_FULL_PATH" | cut -d '/' -f 2)
            if [ "$PR_NUMBER" = "0" ] || [ -z "$PR_NUMBER" ]; then continue; fi

            if [ "$PROJECT_NAME" = "manifests" ]; then
              cd .repo/manifests
              git fetch origin "pull/$PR_NUMBER/head:pr-branch"
              LATEST_SHA=$(git rev-parse pr-branch)
              cd -
            else
              REPO_PATH=$(grep "\"$PROJECT_NAME\"" .repo/manifests/openvela.xml | awk -F'"' '{print $2}')
              if [ -z "$REPO_PATH" ]; then
                echo "::warning::no manifest path for $PROJECT_NAME"
                continue
              fi
              cd "$REPO_PATH"
              git fetch "https://gitee.com/$REPO_FULL_PATH.git" "pull/$PR_NUMBER/head:pr-branch"
              LATEST_SHA=$(git rev-parse pr-branch)
              cd -
            fi
            echo "${REPO_FULL_PATH}:${PR_NUMBER}:${LATEST_SHA}" >> "$PR_INFO_FILE"
            echo "Recorded: ${REPO_FULL_PATH} PR#${PR_NUMBER} SHA=${LATEST_SHA}"
          done
          echo "name=$SNAPSHOT_NAME" >> $GITHUB_OUTPUT

      - name: Upload snapshot and PR info
        uses: actions/upload-artifact@v4
        with:
          name: source_info
          path: |
            ${{ steps.snapshot.outputs.name }}
            pr_info_*

  # ============================================================
  # Job 3: one job per upstream group
  #
  # Everything that varies per group comes from the derived matrix:
  # matrix.tasks, matrix.ntfc, matrix.job_minutes, matrix.step_minutes.
  # ============================================================
  ci-tasks:
    needs: [parse, setup]
    runs-on: ubuntu-latest
    # matrix is available in a job-level timeout expression, so each group gets
    # the bound derived from its own tasks: build-only groups keep GitHub's 360
    # default, a group with one NTFC task gets 180.
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      matrix: ${{ fromJSON(needs.parse.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v5
        with:
          path: .ci-runner

      - name: Show resolved task plan
        env:
          CI_TASKS: ${{ join(matrix.tasks, ' ') }}
          CI_NTFC: ${{ matrix.ntfc }}
          CI_NTFC_TASKS: ${{ join(matrix.ntfc_tasks, ' ') }}
        run: |
          echo "group        : ${{ matrix.group }}"
          echo "tasks        : ${CI_TASKS}"
          echo "ntfc         : ${CI_NTFC}  (${CI_NTFC_TASKS:-none})"
          echo "job timeout  : ${{ matrix.job_minutes }} min"
          echo "step timeout : ${{ matrix.step_minutes }} min"
          echo "upstream     : sha256:${{ needs.parse.outputs.fingerprint }}"

      - name: Download snapshot and PR info
        uses: actions/download-artifact@v4
        with:
          name: source_info

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo Init and Sync from snapshot
        env:
          PR_BRANCH: ${{ needs.parse.outputs.pr_branch }}
          MANIFEST_URL: ${{ needs.parse.outputs.manifest_url }}
          SNAPSHOT_FILE: ${{ needs.setup.outputs.snapshot }}
        run: |
          set -euo pipefail
          # repo init rewrites the workspace, so keep the inputs elsewhere.
          cp "$SNAPSHOT_FILE" /tmp/ 2>/dev/null || true
          cp pr_info_* /tmp/ 2>/dev/null || true
          repo init -u "$MANIFEST_URL" -b "${PR_BRANCH:-trunk}" -m openvela.xml \
            --group=default,platform-linux --depth=1 --git-lfs
          cp "/tmp/$SNAPSHOT_FILE" .repo/manifests/
          repo init -m "$SNAPSHOT_FILE" --group=default,platform-linux --depth=1 --git-lfs
          echo "Active manifest: $(readlink -f .repo/manifest.xml || echo unknown)"
          repo sync -c -d --no-tags --force-sync -j$(nproc)
          df -h

      - name: Cherry-pick PRs
        env:
          ALL_PR: ${{ needs.parse.outputs.all_pr }}
          SNAPSHOT_FILE: ${{ needs.setup.outputs.snapshot }}
        run: |
          set -euo pipefail
          git config --global user.email "openvela-robot@xiaomi.com"
          git config --global user.name "openvela-robot"
          PR_INFO_FILE=$(ls /tmp/pr_info_* 2>/dev/null | head -1 || true)
          if [ -z "${ALL_PR}" ] || [ -z "$PR_INFO_FILE" ] || [ ! -s "$PR_INFO_FILE" ]; then
            echo "No PRs to cherry-pick"
            exit 0
          fi
          for PR_INFO in $ALL_PR; do
            REPO_FULL_PATH=$(echo "$PR_INFO" | cut -d ':' -f 1 | xargs)
            PR_NUMBER=$(echo "$PR_INFO" | cut -d ':' -f 2)
            PROJECT_NAME=$(echo "$REPO_FULL_PATH" | cut -d '/' -f 2)
            [ "$PR_NUMBER" = "0" ] && continue
            PR_COMMIT=$(grep "^${REPO_FULL_PATH}:" "$PR_INFO_FILE" | awk -F':' '{print $3}')
            if [ -z "$PR_COMMIT" ]; then
              echo "::error::no recorded commit for $REPO_FULL_PATH; setup and build disagree"
              exit 1
            fi
            if [ "$PROJECT_NAME" = "manifests" ]; then
              cd .repo/manifests
              git fetch origin "pull/$PR_NUMBER/head:pr-branch"
              git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT)
              cd -
              repo sync -c -d --no-tags --force-sync -j$(nproc)
            else
              REPO_PATH=$(grep "\"$PROJECT_NAME\"" ".repo/manifests/$SNAPSHOT_FILE" | awk -F'path="' '{print $2}' | awk -F'"' '{print $1}')
              if [ -z "$REPO_PATH" ]; then
                REPO_PATH=$(grep "\"$PROJECT_NAME\"" ".repo/manifests/$SNAPSHOT_FILE" | awk -F'name="' '{print $2}' | awk -F'"' '{print $1}')
              fi
              if [ -z "$REPO_PATH" ]; then
                echo "::error::no manifest path for $PROJECT_NAME"
                exit 1
              fi
              cd "$REPO_PATH"
              git fetch "https://gitee.com/$REPO_FULL_PATH.git" "pull/$PR_NUMBER/head:pr-branch"
              git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT)
              cd -
            fi
          done

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Load upstream pins
        env:
          PINS: ${{ needs.parse.outputs.pins }}
        run: |
          set -euo pipefail
          # KEY=VALUE lines produced by ci_matrix.py --format env, so the image
          # and the NTFC versions follow upstream without being restated here.
          printf '%s\n' "$PINS" | grep -E '^CI_[A-Z_]+=' >> $GITHUB_ENV
          printf '%s\n' "$PINS"

      - name: Docker Pull
        run: |
          docker pull "${CI_DOCKER_IMAGE}"
          df -h

      - name: Clean up after Docker pull
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker builder prune -a 2>/dev/null || true
          df -h

      - name: Build tasks
        env:
          CI_WORKSPACE: ${{ github.workspace }}
          CI_TRIGGER_REPO: ${{ needs.parse.outputs.repo }}
          CI_PR_NUMBER: ${{ needs.parse.outputs.pr_id }}
          CI_TASKS: ${{ join(matrix.tasks, ' ') }}
        run: |
          set -euo pipefail
          bash .ci-runner/tools/ci/task_exec.sh build "${{ matrix.group }}" ${CI_TASKS}

      # Own step with its own bound: a step timeout is an ordinary step failure,
      # so the collector and the upload below stay reachable. A job timeout is
      # reported as cancelled, under which neither would run.
      - name: Run NTFC runtime tests
        if: ${{ matrix.ntfc == 'true' }}
        timeout-minutes: ${{ matrix.step_minutes }}
        env:
          CI_WORKSPACE: ${{ github.workspace }}
          NTFC_CONTAINER: ntfc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash .ci-runner/tools/ci/task_exec.sh ntfc "${{ matrix.group }}"

      - name: Collect NTFC diagnostics
        if: ${{ always() && matrix.ntfc == 'true' }}
        env:
          CI_WORKSPACE: ${{ github.workspace }}
          NTFC_CONTAINER: ntfc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bash .ci-runner/tools/ci/task_exec.sh collect "${{ matrix.group }}" || true

      # Build-only groups upload on success. The NTFC groups also upload on an
      # ordinary failure, which is exactly when their console captures matter.
      - name: Archive CI Build Package
        if: ${{ success() || (!cancelled() && matrix.ntfc == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: Build_Package_${{ matrix.group }}
          path: ${{ matrix.group }}
          if-no-files-found: warn

  # ============================================================
  # Job 4: single aggregated status for Jenkins to read
  # ============================================================
  result:
    needs: [parse, ci-tasks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          CI_TASKS_STATUS: ${{ needs.ci-tasks.result }}
        run: |
          echo "upstream matrix: sha256:${{ needs.parse.outputs.fingerprint }}"
          echo "ci-tasks result: ${CI_TASKS_STATUS}"
          if [ "${CI_TASKS_STATUS}" != "success" ]; then
            echo "::error::CI failed: ci-tasks = ${CI_TASKS_STATUS}"
            exit 1
          fi
          echo "CI_RESULT=SUCCESS"
